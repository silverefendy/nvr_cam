services:
  db:
    image: postgres:16-alpine
    container_name: cctv_db
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      POSTGRES_USER: ${DB_USER:-nvr_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-NvrCam2026!}
      POSTGRES_DB: ${DB_NAME:-nvr_cam}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nvr_user} -d ${DB_NAME:-nvr_cam}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cctv_api
    # network_mode: host memungkinkan container akses langsung ke network
    # interface host — wajib untuk:
    #   1. WS-Discovery UDP multicast (port 3702) agar bisa reach kamera
    #   2. Port scan ke subnet kamera (10.3.x.x, 192.168.x.x, dst)
    #   3. Deteksi Dahua port 37777/37778
    # Konsekuensi: 'ports:' mapping tidak berlaku — port API langsung
    # terbuka di host pada APP_PORT (default 8000).
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      DB_HOST: ${DB_HOST:-127.0.0.1}   # host karena network_mode: host
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-nvr_cam}
      DB_USER: ${DB_USER:-nvr_user}
      DB_PASSWORD: ${DB_PASSWORD:-NvrCam2026!}
      JWT_SECRET: ${JWT_SECRET:-changeme_minimal_32_chars_secret_key}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-60}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      STORAGE_THRESHOLD_PCT: ${STORAGE_THRESHOLD_PCT:-10.0}
      HLS_TEMP_DIR: ${HLS_TEMP_DIR:-/tmp/hls}
      CONFIG_DIR: ${CONFIG_DIR:-config}
    volumes:
      - ./config:/app/config
      - ./scripts:/app/scripts:ro
      - nvr_recordings:/mnt/driveA
      - hls_data:/var/lib/nvr_cam/hls
      - snapshot_data:/var/lib/nvr_cam/snapshots
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend.prod
    container_name: cctv_web
    ports:
      - "3000:80"
    volumes:
      - hls_data:/var/lib/nvr_cam/hls:ro
      - snapshot_data:/var/lib/nvr_cam/snapshots:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  hls_data:
  snapshot_data:
  nvr_recordings:
