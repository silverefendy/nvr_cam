services:
  db:
    image: postgres:16-alpine
    container_name: cctv_db
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nvr_user} -d ${DB_NAME:-nvr_cam}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cctv_api
    env_file: .env
    volumes:
      - ./config:/app/config
      - ./scripts:/app/scripts:ro
      # Mount folder rekaman dari host — sesuaikan path dengan server production
      # Contoh Linux: /mnt/nvr_recordings:/mnt/driveA
      # Contoh Windows dev: menggunakan volume Docker di bawah
      - nvr_recordings:/mnt/driveA
      - hls_data:/var/lib/nvr_cam/hls
      - snapshot_data:/var/lib/nvr_cam/snapshots
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend.prod
    container_name: cctv_web
    ports:
      - "3000:80"
    volumes:
      - hls_data:/var/lib/nvr_cam/hls:ro
      - snapshot_data:/var/lib/nvr_cam/snapshots:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  hls_data:
  snapshot_data:
  # Volume dev untuk rekaman (production: ganti dengan bind mount ke folder HDD)
  # Untuk production: edit volumes di atas dan tambahkan:
  #   - /mnt/nvr_recordings:/mnt/driveA
  nvr_recordings:
