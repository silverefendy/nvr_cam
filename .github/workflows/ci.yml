name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  config-and-docker:
    name: Config and Docker smoke
    runs-on: ubuntu-latest
    env:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: nvr_cam
      DB_USER: nvr_user
      DB_PASSWORD: ci-db-password
      JWT_SECRET: ci-jwt-secret-with-at-least-32-bytes
      APP_ENV: production
      CORS_ALLOW_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare CI env file
        run: cp .env.example .env

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Validate YAML config
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in [
              Path("config/cameras.yaml"),
              Path("config/storage.yaml"),
              Path("config/system.yaml"),
              Path("docker-compose.yml"),
              Path("docker-compose.dev.yml"),
              Path(".github/workflows/ci.yml"),
          ]:
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"OK: {path}")
          PY

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config >/tmp/docker-compose.yml
          docker compose -f docker-compose.dev.yml config >/tmp/docker-compose.dev.yml

      - name: Build backend image
        run: docker build -t nvr-cam-backend-ci -f Dockerfile.backend .

      - name: Smoke backend container import
        run: |
          docker run --rm \
            -e DB_HOST=db \
            -e DB_PORT=5432 \
            -e DB_NAME=nvr_cam \
            -e DB_USER=nvr_user \
            -e DB_PASSWORD=ci-db-password \
            -e JWT_SECRET=ci-jwt-secret-with-at-least-32-bytes \
            -e APP_ENV=production \
            -e CORS_ALLOW_ORIGINS=http://localhost:3000 \
            nvr-cam-backend-ci \
            python -c "from backend.api.app import app; print(app.title)"

      - name: Build frontend image
        run: docker build -t nvr-cam-frontend-ci -f frontend/Dockerfile.frontend.prod .
